---
name: Bump Temurin's JDK21 version

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"
  temurin21-binaries:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "adoptium"
      repository: "temurin21-binaries"
      token: '{{ requiredEnv .github.token }}'
      branch: "main"

sources:
  lastVersion:
    kind: temurin
    name: Get the latest Adoptium JDK21 version
    spec:
      featureversion: 21
    transformers:
      - trimprefix: "jdk-"
  windows_x64_installer_url:
    name: Retrieve the latest Installer URL (ZIP) for Windows x64
    kind: temurin
    spec:
      architecture: x64
      featureversion: 21
      operatingsystem: windows
      releasetype: ga
      result: installer_url

conditions:
  checkTemurinAllReleases:
    name: Check if the "<lastTemurin21Version>" is available for all platforms
    kind: temurin
    sourceid: lastVersion
    spec:
      featureversion: 21
      platforms:
        - alpine-linux/x64
        - alpine-linux/aarch64
        - linux/x64
        - linux/aarch64
        - linux/ppc64le
        - linux/s390x
        - windows/x64

targets:
  setJDK21VersionDockerBake:
    name: "Bump JDK21 version for Linux images in the docker-bake.hcl file"
    kind: hcl
    sourceid: lastVersion
    transformers:
      - replacer:
          from: "+"
          to: "_"
    spec:
      file: docker-bake.hcl
      path: variable.JAVA21_VERSION.default
    scmid: default
  setJDK17WindowsInstallerUrl:
    name: Bump JDK Installer URL for Windows x64
    kind: json
    sourceid: windows_x64_installer_url
    spec:
      file: docker-bake.override.json
      engine: dasel/v2
      key: variable.
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: Bump JDK21 version to {{ source "lastVersion" }}
    spec:
      labels:
        - dependencies
        - jdk21
